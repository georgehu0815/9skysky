<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770">
<rect width="1040" height="770" rx="18" fill="#f4f8fa"/>
<text x="38" y="52" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#183448">Swing: teach a reachable skill, then refine with PPO</text>
<rect x="38" y="88" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="122" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">01  Input</text>
<text x="60" y="153" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Two-string mechanism at rest; nominal XML actuators</text>
<path d="M520 179v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="204" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="238" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">02  Establish feasibility</text>
<text x="60" y="269" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Privileged teacher generates labels, not inference observations</text>
<path d="M520 295v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="320" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="354" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">03  Initialize</text>
<text x="60" y="385" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">BC / DAgger stage 3; no PPO transitions credited to imitation</text>
<path d="M520 411v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="436" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="470" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">04  Refine</text>
<text x="60" y="501" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Frozen observation statistics; 524,288 conservative PPO steps</text>
<path d="M520 527v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="552" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="586" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">05  Evaluate</text>
<text x="60" y="617" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">24 seconds; symmetric span ≥ 150°; both strings always taut</text>
<text x="38" y="740" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#183448">All measured outcomes are nominal simulation evidence; proposed extensions are untested.</text>
</svg>