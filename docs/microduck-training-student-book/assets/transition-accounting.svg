<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770">
<rect width="1040" height="770" rx="18" fill="#f4f8fa"/>
<text x="38" y="52" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#183448">One Swing refinement, three counters</text>
<rect x="38" y="88" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="122" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">01  One rollout</text>
<text x="60" y="153" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">16 environments × 256 steps = 4096 new transitions</text>
<path d="M520 179v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="204" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="238" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">02  Whole PPO phase</text>
<text x="60" y="269" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">128 rollouts × 4096 = 524,288 new transitions</text>
<path d="M520 295v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="320" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="354" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">03  Optimizer work</text>
<text x="60" y="385" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">128 rollouts × 2 epochs × 4 minibatches = 1024 updates</text>
<path d="M520 411v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="436" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="470" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">04  Sample reuse</text>
<text x="60" y="501" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">524,288 transitions × 2 epochs = 1,048,576 presentations</text>
<path d="M520 527v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="552" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="586" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">05  Separate acquisition ledger</text>
<text x="60" y="617" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">38,400 teacher labels at selected DAgger stage 3; PPO steps = 0</text>
<text x="38" y="740" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#183448">Counters are not interchangeable. Earlier failed runs and evaluations are excluded.</text>
</svg>