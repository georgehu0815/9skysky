<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770">
<rect width="1040" height="770" rx="18" fill="#f4f8fa"/>
<text x="38" y="52" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#183448">Dance: turn choreography into a testable target</text>
<rect x="38" y="88" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="122" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">01  Input</text>
<text x="60" y="153" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Bachata JSON → hashed first 8 seconds; 14 joint targets</text>
<path d="M520 179v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="204" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="238" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">02  Observe</text>
<text x="60" y="269" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Proprioception + task phase in the existing 61-slot layout</text>
<path d="M520 295v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="320" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="354" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">03  Optimize</text>
<text x="60" y="385" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Fresh PPO; precise pose kernel; physical balance maintained</text>
<path d="M520 411v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="436" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="470" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">04  Evaluate</text>
<text x="60" y="501" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Pose and leg tracking vs static baselines; balance; full coverage</text>
<path d="M520 527v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="552" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="586" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">05  Output</text>
<text x="60" y="617" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">ONNX + 8-second audit + 16-second two-cycle video</text>
<text x="38" y="740" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#183448">All measured outcomes are nominal simulation evidence; proposed extensions are untested.</text>
