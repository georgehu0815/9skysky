<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="886" viewBox="0 0 1040 886">
<rect width="1040" height="886" rx="18" fill="#f4f8fa"/>
<text x="38" y="52" font-family="DejaVu Sans" font-size="31" font-weight="bold" fill="#183448">One experiment, two connected loops</text>
<rect x="38" y="88" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="122" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">01  Specify a task</text>
<text x="60" y="153" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Clip or command + morphology + versioned recipe + seed</text>
<path d="M520 179v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="204" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="238" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">02  Studio / API</text>
<text x="60" y="269" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Validated request → job runner → RLX Studio entry point</text>
<path d="M520 295v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="320" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="354" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">03  Collect experience</text>
<text x="60" y="385" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">CPU MuJoCo workers: 61 observations → 14 actions at 50 Hz</text>
<path d="M520 411v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="436" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="470" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">04  Learn with PPO</text>
<text x="60" y="501" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">MLX/Metal actor + critic updates; repeat collection and learning</text>
<path d="M520 527v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="552" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="586" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">05  Freeze and export</text>
<text x="60" y="617" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Checkpoint + normalizer sidecar → deterministic ONNX</text>
<path d="M520 643v20m-7-7 7 7 7-7" fill="none" stroke="#087b79" stroke-width="3"/>
<rect x="38" y="668" width="964" height="90" rx="12" fill="white" stroke="#adc5d0" stroke-width="2"/>
<text x="60" y="702" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#087b79">06  Test independently</text>
<text x="60" y="733" font-family="DejaVu Sans" font-size="20" font-weight="normal" fill="#183448">Skill gates + controls + full MP4 + physical traces + hashes</text>
<text x="38" y="856" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#183448">Feedback: failed physical tests revise the next experiment, never the acceptance gate.</text>
</svg>